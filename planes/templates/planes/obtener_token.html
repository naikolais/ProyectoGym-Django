{% extends 'planes/base.html' %}
{% block title %}Obtener Token API{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>🔑 Generar Token de API REST</h4>
            </div>
            <div class="card-body">
                <form method="post" action="{% url 'api_token_auth' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario de Django</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Obtener Token</button>
                </form>
                <div class="mt-3 text-muted small">
                    * Al hacer clic, enviarás las credenciales por POST a la ruta de la API y el navegador te mostrará el JSON con tu token de acceso.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
