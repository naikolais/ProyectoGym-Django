{% extends 'planes/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">⚠️ Confirmar Eliminación</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">¿Estás seguro de que deseas eliminar este plan?</p>
                <p class="fw-bold text-danger fs-4">{{ plan.nombre }} - ${{ plan.precio }}</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'listar_planes' %}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar de MySQL</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
